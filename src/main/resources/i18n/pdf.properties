# Labels and headings of the generated PDFs (area sheet, sector tables, problem sheet).
# This is the base bundle, so it is also what every language without its own file falls back to:
# keep it English. Keys containing {0} are java.text.MessageFormat patterns, plain keys are used
# verbatim. Adding a language = adding a pdf_<code>.properties file with a subset of these keys;
# adding a label = adding a key here, in pdf_cs.properties, and an accessor in PdfText.

# Sheet metadata (area and problem info tables)
pdf.generated=Generated
pdf.url=URL
pdf.description=Description
pdf.gradeDistribution=Grade Dist.
pdf.accessClosed=Access closed: {0}
pdf.accessInfo=Access info: {0}

# Problem info table
pdf.area=Area
pdf.sector=Sector
pdf.firstAscentAid=FA (Aid)
pdf.firstAscent=First Ascent
pdf.length=Length

# Multi-pitch sections; {0} is the pitch number
pdf.pitch=Pitch {0}

# Sector table headers
pdf.columnName=Name
pdf.columnGrade=Grade
pdf.columnType=Type
pdf.columnFirstAscent=FA
pdf.columnNote=Note

# Sector table cells; {0} is the rock name / the number of ascents
pdf.rock=Rock: {0}
pdf.ascentCount={0} {0,choice,0#ascents|1#ascent|2#ascents}

# Headings of the problem sheet
pdf.ascents=Ascents
pdf.comments=Comments

# Footer; the total number of pages is appended by the generator
pdf.footer.page=Page {0} of
