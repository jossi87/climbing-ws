# Czech labels and headings of the generated PDFs. Every key missing here is taken from the
# English base bundle (pdf.properties). Keys containing {0} are java.text.MessageFormat patterns.
# The wording follows climbing-web/src/i18n/locales/cs.ts, so a printed sheet reads like the page
# it was printed from.

# Sheet metadata (area and problem info tables)
pdf.generated=Vygenerováno
pdf.url=URL
pdf.description=Popis
pdf.gradeDistribution=Rozložení obtížností
pdf.accessClosed=Přístup uzavřen: {0}
pdf.accessInfo=Informace o přístupu: {0}

# Problem info table
pdf.area=Oblast
pdf.sector=Sektor
pdf.firstAscentAid=Prvovýstup (Aid)
pdf.firstAscent=Prvovýstup
pdf.length=Délka

# Multi-pitch sections; {0} is the pitch number (Czech climbing calls a pitch "délka")
pdf.pitch=Délka {0}

# Sector table headers
pdf.columnName=Název
pdf.columnGrade=Obtížnost
pdf.columnType=Typ
pdf.columnFirstAscent=FA
pdf.columnNote=Poznámka

# Sector table cells; {0} is the rock name / the number of ascents
pdf.rock=Skála: {0}
pdf.ascentCount={0} {0,choice,0#přelezů|1#přelez|2#přelezy|5#přelezů}

# Headings of the problem sheet
pdf.ascents=Přelezy
pdf.comments=Komentáře

# Footer; the total number of pages is appended by the generator
pdf.footer.page=Strana {0} z
